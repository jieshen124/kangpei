server {
    # 同时监听 80（http）和 443（https），同一份内容
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # 自签证书（浏览器会提示不受信任，但不影响加密传输）
    ssl_certificate     /etc/nginx/ssl/site.crt;
    ssl_certificate_key /etc/nginx/ssl/site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/site;
    index index.html;

    charset utf-8;

    # 静态资源压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml image/svg+xml;

    # 缓存：html 不缓存，带指纹的静态资源长缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 不暴露敏感文件
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(conf|bak|sql|log|env)$ {
        deny all;
    }

    access_log /var/log/nginx/site.access.log;
    error_log  /var/log/nginx/site.error.log warn;
}

# 可选：把 http 强制跳转到 https（需要公网端口能映射到 443 时再启用）
